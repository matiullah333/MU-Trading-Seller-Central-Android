name: Build MU Trading Seller APK V2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract V2 Android project
        run: |
          mkdir android-project
          unzip -q MU_Trading_Seller_Central_Android_Project_FIXED_V2.zip -d android-project

      - name: Find project directory
        id: project
        run: |
          PROJECT_DIR=$(dirname "$(find android-project -name settings.gradle -type f | head -1)")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MU-Trading-Seller-APK-V2
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
